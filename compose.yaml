services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:8.0}
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Please set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Please set MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    stop_grace_period: 60s

volumes:
  mongodb_data: